  customElements.define("ha-icon", class extends HTMLElement {
    static observedAttributes = ["icon"];
    attributeChangedCallback() {
      this.style.cssText = "display:inline-grid;place-items:center;line-height:0";
      this.innerHTML = `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor"><path d="${MDI[this.getAttribute("icon")] || ""}"/></svg>`;

</head><body>
<div class="grid" id="g"></div>
<script type="module">
  // a fake Home Assistant: just enough of `hass` for the cards
  const P = "maquina_loica", now = Date.now(), iso = t => new Date(t).toISOString();
  // Home Assistant itself in English (the integration translates programmes into English); the cards force Portuguese
  const names = { eco: "Eco 45°C", auto_universal: "Auto Universal 50-60°C", intensive: "Intensive", rapid_29: "Rapid 29' 50°C", glass_care: "Glass Care", iot_baby_care: "Baby Care" };
  const scen = {
    "A lavar": { mode: "2", phase: "2", prog: "auto_universal", start: now - 40 * 60e3, end: now + 52 * 60e3, extra_dry: "on" },
    "A secar": { mode: "2", phase: "4", prog: "eco", start: now - 150 * 60e3, end: now + 25 * 60e3 },
    "Início diferido": { mode: "3", phase: "0", prog: "intensive", delay: 90, start: NaN, end: now + 210 * 60e3 },
    "Terminado": { mode: "7", phase: "5", prog: "eco", salt: "on" },
    "Desligada": { mode: "1", phase: "0", prog: "No program", power: "off", remote: "off" },
  };
  const hassFor = s => {
    const st = (id, state, a = {}) => [id, { entity_id: id, state: String(state), attributes: a, last_changed: iso(now - 60e3), last_updated: iso(now - 30e3) }];
    const states = Object.fromEntries([
      st(`binary_sensor.${P}_status`, s.power || "on"),
      st(`binary_sensor.${P}_remote_control`, s.remote || "on"),
      st(`binary_sensor.${P}_door_status`, "off"),
      st(`binary_sensor.${P}_salt`, s.salt || "off"),
      st(`binary_sensor.${P}_rinse_aid`, "off"),
      st(`binary_sensor.${P}_extra_dry`, s.extra_dry || "off"),
      st(`binary_sensor.${P}_half_load`, "off"),
      st(`sensor.${P}_mode`, s.mode),
      st(`sensor.${P}_program_phase`, s.phase),
      st(`sensor.${P}_program_name`, s.prog),
      st(`sensor.${P}_delay_time`, s.delay || 0),
      st(`sensor.${P}_remaining_time`, isNaN(s.end ?? NaN) ? 0 : Math.round((s.end - now) / 60e3)),
      st(`sensor.${P}_start_time`, isNaN(s.start ?? NaN) ? "unknown" : iso(s.start)),
      st(`sensor.${P}_end_time`, isNaN(s.end ?? NaN) ? "unknown" : iso(s.end)),
      st(`sensor.${P}_total_wash_cycle`, 412),
    ]);
    const entities = {
      [`sensor.${P}_mode`]: { entity_id: `sensor.${P}_mode`, platform: "hon", translation_key: "dishwasher_mode", device_id: "dev1" },
      [`binary_sensor.${P}_status`]: { entity_id: `binary_sensor.${P}_status`, platform: "hon", device_id: "dev1" },
    };
    return { states, entities, language: "en", locale: { language: "en" },
      formatEntityState: (so, v) => names[v ?? so.state] ?? (v ?? so.state),
      callService: async (d, s, data) => {
        console.log("callService", d, s, data);
        if (data.program === "__list_programmes__")
          throw new Error("Invalid [Program] value, allowed values [eco, auto_universal, auto_universal_soil, intensive, rapid_29, glass_care, iot_baby_care]");
      } };
  };
  await customElements.whenDefined("hon-dishwasher-card");
  const g = document.getElementById("g");
  for (const [t, s] of Object.entries(scen)) {
    const box = document.createElement("div"); box.innerHTML = `<h3>${t}</h3>`;
    const card = document.createElement("hon-dishwasher-card");
    card.setConfig(t === "Desligada" ? {} : { name: "Máquina da loiça", language: "pt" });
    box.append(card); g.append(box); card.hass = hassFor(s);
  }
  const programmes = (wrap, title) => {
    const box = document.createElement("div"); box.innerHTML = `<h3>${title}</h3>`; if (wrap) box.style.cssText = wrap;
    const pc = document.createElement("hon-dishwasher-programmes-card");
    pc.setConfig({ name: "Máquina da loiça", language: "pt", favourites: ["eco", "auto_universal", "intensive", "rapid_29"] });
    box.append(pc); g.append(box); pc.hass = hassFor({ mode: "1", phase: "0", prog: "eco" });
  };
  programmes(null, "Programas");
  // the Origami theme's light mode (its variables, as Home Assistant sets them)
  const ORIGAMI_LIGHT = "--primary-text-color:#4F4C49;--ha-card-background:#FFFFFF;--blue-color:#587397;--green-color:#758671;--orange-color:#B27C43;"
    + "--red-color:#A75050;--grey-color:#94928E;--fill-subtle:color-mix(in srgb,#8A7A64 7%,transparent);--fill-strong:color-mix(in srgb,#8A7A64 12%,transparent);"
    + "--toggle-on:color-mix(in srgb,#4F4C49 85%,#FFFFFF);--ha-card-box-shadow:0 1px 2px rgba(138,122,100,.12),0 6px 14px -6px rgba(138,122,100,.25);"
    + "--primary-font-family:'Montserrat',sans-serif;--ha-card-border-radius:22px;--radius-ratio:.35;background:#F6F4F1;padding:8px;border-radius:16px;color:#4F4C49";
  {
    const box = document.createElement("div"); box.innerHTML = "<h3>A secar, com o tema Origami (claro)</h3>"; box.style.cssText = ORIGAMI_LIGHT;
    const card = document.createElement("hon-dishwasher-card"); card.setConfig({ name: "Máquina da loiça", language: "pt" });
    box.append(card); g.append(box); card.hass = hassFor(scen["A secar"]);
  }
  programmes(ORIGAMI_LIGHT, "Programas, com o tema Origami (claro)");
</script>
</body></html>
